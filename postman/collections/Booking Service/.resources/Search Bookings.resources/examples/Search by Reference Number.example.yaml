$kind: http-example
name: Search by Reference Number
request:
  method: POST
  url: '{{baseUrl}}/bookings/search'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "searchType": "REFERENCE_NUMBER_SEARCH",
        "customerId": null,
        "referenceNumber": "ABC123"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "referenceNumber": "ABC123",
        "customerId": 1,
        "flightId": 1
      }
